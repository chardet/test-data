        <script type='text/javascript'>
            //ニュース詳細表示実行イベント
            var gPrevData = "";
            var gPrevPosition = "";
            
            function clickWhatsNewInfo_Item(pItemName, pRecNum, pColNum, pMode){
                if (gPrevPosition != ""){
                    if (gPrevPosition == "WhatsNewInfo." + pRecNum + "-4"){
                        document.getElementById(gPrevPosition).innerHTML = gPrevData;
                        pPrevData = "";
                        gPrevPosition = "";
                        return;
                    }else{
                        document.getElementById(gPrevPosition).innerHTML = gPrevData;
                        }
                    }
                gPrevPosition = "WhatsNewInfo." + pRecNum + "-4";
                gPrevData = document.getElementById(gPrevPosition).innerHTML;
                
                try {
                    xmlhttp = new ActiveXObject("Msxml2.XMLHTTP");
                } catch (e) {
                    try {
                        xmlhttp = new ActiveXObject("Microsoft.XMLHTTP");
                    } catch (e) {
                        xmlhttp = false;
                        }
                    }
                if (!xmlhttp && typeof XMLHttpRequest!='undefined') {
                    xmlhttp = new XMLHttpRequest();
                    }
                    
                if (xmlhttp) {
                    xmlhttp.onreadystatechange = function() {
                        if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {
                            var writeText = xmlhttp.responseText;
                            document.getElementById(gPrevPosition).innerHTML = writeText;
                            }
                        }
                    execUrl="top_info";
                    execPram="SelectData=" + document.getElementById("WhatsNewInfo." + pRecNum + "-1").value;
                    xmlhttp.open('GET', execUrl + "?" + execPram, false);
                    xmlhttp.send(null);
                    }
                }
        </script>
